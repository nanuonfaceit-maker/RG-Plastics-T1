name: Nightly Automated Database Vault Backup

on:
  schedule:
    # Runs every night at midnight UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  backup:
    name: Run Database Vault Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vault Backup Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/backup-vault.mjs

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rg-plastics-vault-backups
          path: backups/
          retention-days: 90
